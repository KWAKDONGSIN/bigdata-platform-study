<script>window.QUIZ=[{"id": "fc2c4ac6", "ch": "basic", "type": "short", "q": "컴퓨터 안에서 0 또는 1 한 자리를 나타내는 가장 작은 정보 단위는?", "answer": "비트", "alts": ["bit"], "explain": "binary digit(이진 숫자)를 줄인 말이에요. 전등 스위치처럼 켜짐(1) 또는 꺼짐(0)만 담아요.", "src": "3주차 슬라이드 7"}, {"id": "c4111ac5", "ch": "basic", "type": "short", "q": "8비트를 하나로 묶은 단위는?", "answer": "바이트", "alts": ["byte", "1바이트"], "explain": "비트 8개가 1바이트예요. 0부터 255까지 256가지를 담을 수 있어요.", "src": "3주차 슬라이드 7"}, {"id": "b10222b3", "ch": "basic", "type": "ox", "q": "4비트를 묶은 단위를 니블(nibble)이라고 하며, 니블 하나는 16진수 한 자리와 같다.", "answer": true, "explain": "비트 4개는 0000~1111로 16가지라 16진수 한 자리(0~F)와 딱 맞아요.", "src": "3주차 슬라이드 7, 11"}, {"id": "7439f780", "ch": "basic", "type": "mc", "q": "컴퓨터 회로에서 전기 신호 5V와 0V는 각각 무엇을 뜻하나요?", "choices": ["5V는 0, 0V는 1", "5V는 1, 0V는 0", "둘 다 1", "둘 다 0"], "answer": 1, "explain": "5V(전기가 흐름)는 1, 0V(전기가 안 흐름)는 0으로 약속해요. 그래서 모든 정보를 0과 1로 바꿔야 해요.", "src": "3주차 녹취"}, {"id": "e6b8b1ea", "ch": "basic", "type": "mc", "q": "3GHz CPU는 1초에 대략 몇 번 동작하나요?", "choices": ["3천 번", "300만 번", "30억 번", "3조 번"], "answer": 2, "explain": "G(기가)는 10억이라 3GHz는 초당 약 30억 번이에요. 무어·클럭 문제에서 자주 써요.", "src": "4주차 녹취, 6주차 PDF 49쪽"}, {"id": "97054f12", "ch": "basic", "type": "short", "q": "단순한 계산이 아니라 문제 해결 과정 전체를 뜻하는 계산(영어 단어)은? (calculation과 구분)", "answer": "computation", "alts": ["컴퓨테이션"], "explain": "computation은 문제를 풀어 가는 과정 전체이고, calculation은 덧셈·뺄셈 같은 단순 계산이에요.", "src": "2주차 슬라이드 4"}, {"id": "e99e1271", "ch": "basic", "type": "mc", "q": "컴퓨터를 켜면 가장 먼저 실행되어 하드웨어 자원과 응용 프로그램을 관리하는 소프트웨어는?", "choices": ["엑셀", "인터프리터", "운영체제(OS)", "게임"], "answer": 2, "explain": "운영체제는 전원을 켜면 가장 먼저 시작되고 CPU, 메모리, 저장장치를 관리해요.", "src": "6주차 녹취, 기출 Q1.10"}, {"id": "a6c661d0", "ch": "basic", "type": "short", "q": "파이썬 코드를 한 줄씩 읽어 기계어로 바꿔 CPU가 실행할 수 있게 해 주는 프로그램은?", "answer": "인터프리터", "alts": ["interpreter", "파이썬 인터프리터"], "explain": "파이썬 한 줄이 바로 CPU에서 실행되지 않고, 인터프리터가 어셈블리어·기계어로 번역해 줘요.", "src": "3주차 녹취"}, {"id": "7c08c593", "ch": "intro", "type": "short", "q": "프로그램과 데이터를 기억장치에 저장해 두고, 명령어를 하나씩 CPU로 가져와 실행하는 컴퓨터 구조 이름은?", "answer": "폰노이만 구조", "alts": ["폰 노이만 구조", "폰노이만", "폰 노이만", "프로그램 내장형 컴퓨터", "von neumann"], "explain": "폰노이만이 제안한 '프로그램 내장형' 구조예요. 오늘날 모든 컴퓨터가 이 방식이에요.", "src": "2주차 슬라이드 12, 기출 Q1.1"}, {"id": "a796a209", "ch": "intro", "type": "mc", "q": "폰노이만 구조에서 '실행 중인' 프로그램과 데이터를 저장하는 장치는?", "choices": ["보조기억장치(SSD)", "주기억장치(RAM)", "그래픽카드", "전원공급장치"], "answer": 1, "explain": "실행 중이면 RAM, 실행이 끝난 뒤 영구 보관은 보조기억장치예요.", "src": "2주차 슬라이드 13"}, {"id": "ae9a4e6e", "ch": "intro", "type": "mc", "q": "실행이 끝난 프로그램과 데이터를 영구 저장하는 장치는?", "choices": ["레지스터", "캐시", "보조기억장치(SSD, HDD)", "시스템 버스"], "answer": 2, "explain": "SSD·HDD는 전원이 꺼져도 데이터가 남는 비휘발성 저장장치예요.", "src": "2주차 슬라이드 13"}, {"id": "81c0fa97", "ch": "intro", "type": "short", "q": "컴퓨터 구성요소들 사이에서 데이터가 오가는 길(data path)을 뭐라고 하나요?", "answer": "시스템 버스", "alts": ["버스", "system bus"], "explain": "버스는 부품들을 잇는 도로예요. 메인보드 위에 있어요.", "src": "2주차 슬라이드 13"}, {"id": "8c0fcb65", "ch": "intro", "type": "ox", "q": "고전 컴퓨터는 프로그램이 물리적 회로에 들어 있어서, 새로운 작업을 하려면 컴퓨터를 새로 만들어야 했다.", "answer": true, "explain": "현대 컴퓨터는 프로그램을 저장장치에 두고 바꿀 수 있어서 소프트웨어만 새로 만들면 돼요.", "src": "2주차 슬라이드 10"}, {"id": "a455fa6b", "ch": "intro", "type": "mc", "q": "컴퓨터 부품 중 교류 전류를 직류 전류로 바꿔 컴퓨터에 전원을 공급하는 것은?", "choices": ["메인보드", "전원공급장치(파워)", "CPU", "RAM"], "answer": 1, "explain": "파워는 콘센트의 교류를 부품이 쓰는 직류로 바꿔 줘요.", "src": "기출 Q2.2 f"}, {"id": "c4802255", "ch": "intro", "type": "mc", "q": "이미지 처리, 딥러닝처럼 행렬 기반의 연산을 병렬로 빠르게 수행하는 부품은?", "choices": ["CPU", "SSD", "그래픽카드(GPU)", "메인보드"], "answer": 2, "explain": "GPU는 간단한 계산 수천 개를 한꺼번에 하는 데 강해요.", "src": "기출 Q2.2 e"}, {"id": "e4607290", "ch": "intro", "type": "short", "q": "(기출 Q3) sum.py를 실행하기 전에 파이썬 실행기와 코드가 보관되어 있는 장치는?", "answer": "보조기억장치", "alts": ["SSD", "HDD", "보조기억장치(SSD)", "보조기억"], "explain": "프로그램은 실행 전에는 SSD 같은 보조기억장치에 있어요. 실행하면 RAM으로 올라와요.", "src": "기출 Q3 A"}, {"id": "90e0c991", "ch": "intro", "type": "short", "q": "(기출 Q3) 코드가 실행되면 파이썬 실행기와 sum.py 코드는 어느 장치에 적재(load)되나요?", "answer": "주기억장치", "alts": ["RAM", "램", "주기억장치(RAM)", "메모리", "주기억"], "explain": "실행하면 RAM(주기억장치)에 올라와요. CPU는 거기서 한 줄씩 가져가 계산해요.", "src": "기출 Q3 B"}, {"id": "ddb19767", "ch": "intro", "type": "short", "q": "(기출 Q3) sum.py의 한 줄을 해석해 만든 기계어를 전달받아 실제로 계산을 실행하는 장치는?", "answer": "CPU", "alts": ["중앙처리장치", "cpu"], "explain": "기계어 명령을 받아 계산하는 것은 CPU(안의 ALU)예요.", "src": "기출 Q3 C"}, {"id": "2700c085", "ch": "intro", "type": "ox", "q": "프로그램이 저장장치에 보관되어 있으면 프로세스, 메모리에서 실행 중이면 프로그램이라고 한다.", "answer": false, "explain": "반대예요. 저장장치에 있으면 프로그램(레시피), 메모리에 올라와 실행 중이면 프로세스(요리)예요.", "src": "기출 Q1.6~1.7, 6주차 슬라이드 62"}, {"id": "33a335a4", "ch": "data", "type": "short", "q": "십진수 137을 1바이트(8비트) 이진수로 나타내면?", "answer": "10001001", "alts": ["1000 1001"], "explain": "자릿값 128 64 32 16 8 4 2 1에서 128 + 8 + 1 = 137이라 1000 1001이에요.", "src": "기출 Q4"}, {"id": "dea8b0cc", "ch": "data", "type": "short", "q": "십진수 77을 1바이트(8비트) 이진수로 나타내면?", "answer": "01001101", "alts": ["0100 1101"], "explain": "자릿값 128 64 32 16 8 4 2 1에서 64 + 8 + 4 + 1 = 77이라 0100 1101이에요.", "src": "기출 Q4"}, {"id": "971e3b49", "ch": "data", "type": "short", "q": "십진수 138을 1바이트(8비트) 이진수로 나타내면?", "answer": "10001010", "alts": ["1000 1010"], "explain": "자릿값 128 64 32 16 8 4 2 1에서 128 + 8 + 2 = 138이라 1000 1010이에요.", "src": "3주차 슬라이드 16"}, {"id": "4f2c52db", "ch": "data", "type": "short", "q": "십진수 27을 1바이트(8비트) 이진수로 나타내면?", "answer": "00011011", "alts": ["0001 1011"], "explain": "자릿값 128 64 32 16 8 4 2 1에서 16 + 8 + 2 + 1 = 27이라 0001 1011이에요.", "src": "3주차 슬라이드 16"}, {"id": "75efc075", "ch": "data", "type": "short", "q": "8비트 이진수 01001100을 십진수로 나타내면?", "answer": "76", "alts": ["76"], "explain": "64 + 8 + 4 = 76이에요. 1이 있는 자릿값만 더해요.", "src": "3주차 슬라이드 15"}, {"id": "7727c61b", "ch": "data", "type": "short", "q": "8비트 이진수 10000011을 십진수로 나타내면?", "answer": "131", "alts": ["131"], "explain": "128 + 2 + 1 = 131이에요.", "src": "3주차 슬라이드 15"}, {"id": "9d0a8726", "ch": "data", "type": "short", "q": "이진수 1100 0101 1001 0001을 16진수로 나타내면?", "answer": "C591", "alts": ["c591", "0xC591"], "explain": "4비트씩 묶어요. 1100은 C, 0101은 5, 1001은 9, 0001은 1이라 C591이에요.", "src": "3주차 슬라이드 12"}, {"id": "e4c59f06", "ch": "data", "type": "short", "q": "이진수 1100010110010001을 8진수로 나타내면? (오른쪽부터 3비트씩 묶기)", "answer": "142621", "alts": ["(142621)8"], "explain": "1 100 010 110 010 001로 묶으면 1, 4, 2, 6, 2, 1이라 142621이에요.", "src": "3주차 슬라이드 12"}, {"id": "cfb9c9c2", "ch": "data", "type": "short", "q": "16진수 D1AF를 이진수로 나타내면?", "answer": "1101000110101111", "alts": ["1101 0001 1010 1111"], "explain": "D=1101, 1=0001, A=1010, F=1111을 이어 붙여요.", "src": "3주차 슬라이드 13"}, {"id": "431ae58f", "ch": "data", "type": "short", "q": "문자 'o'의 ASCII 코드(십진수 111)를 8비트 이진수로 나타내면?", "answer": "01101111", "alts": ["0110 1111"], "explain": "111 = 64 + 32 + 8 + 4 + 2 + 1이라 0110 1111이에요. 기출 Q4의 Robot에 o가 두 번 나와요.", "src": "기출 Q4"}, {"id": "da4f1263", "ch": "data", "type": "short", "q": "문자 'D'의 ASCII 코드(십진수 68)를 8비트 이진수로 나타내면?", "answer": "01000100", "alts": ["0100 0100"], "explain": "68 = 64 + 4라 0100 0100이에요. 수업 슬라이드의 Data 문제 첫 글자예요.", "src": "3주차 슬라이드 26"}, {"id": "c9fcc7b9", "ch": "data", "type": "mc", "q": "8비트(1바이트)로 서로 다르게 표현할 수 있는 값은 몇 가지인가요?", "choices": ["8가지", "64가지", "128가지", "256가지"], "answer": 3, "explain": "비트마다 0 또는 1이라 2의 8제곱 = 256가지(0~255)예요.", "src": "3주차 슬라이드 7, 녹취"}, {"id": "ed386666", "ch": "data", "type": "short", "q": "서로 다른 원소가 25개인 집합에 같은 길이의 코드(고정길이 코드)를 줄 때 필요한 최소 비트 수는?", "answer": "5", "alts": ["5비트", "5 비트"], "explain": "2의 4제곱은 16이라 모자라고, 2의 5제곱은 32라 충분해요. 그래서 log2 25를 올림한 5비트예요.", "src": "3주차 슬라이드 20"}, {"id": "61e6788c", "ch": "data", "type": "short", "q": "십진수 1225를 8421 BCD 코드로 나타내면? (자리마다 4비트)", "answer": "0001 0010 0010 0101", "alts": ["0001001000100101"], "explain": "1, 2, 2, 5를 각각 4비트로 바꿔 이어 써요. 0001 / 0010 / 0010 / 0101이에요.", "src": "3주차 슬라이드 21"}, {"id": "8b971ba1", "ch": "data", "type": "short", "q": "ASCII 'T'(01010100)에 짝수 패리티 비트를 붙일 때 그 비트의 값은?", "answer": "1", "alts": ["1비트"], "explain": "'T'에는 1이 3개라 홀수예요. 짝수로 만들려면 1을 하나 더 붙여야 해서 패리티 비트는 1이에요.", "src": "3주차 슬라이드 23"}, {"id": "603db99e", "ch": "data", "type": "mc", "q": "유니코드에서 한글 완성형 글자는 U+AC00부터 U+D7A3까지 총 몇 자가 정의되어 있나요?", "choices": ["256자", "2,350자", "11,172자", "65,536자"], "answer": 2, "explain": "자음·모음 낱글자만이 아니라 조합된 한글 글자 전부를 하나씩 넣어서 11,172자예요.", "src": "3주차 슬라이드 24"}, {"id": "901d2918", "ch": "data", "type": "short", "q": "(참고, 수업 자료 밖) 8비트 2의 보수에서 5(0000 0101)의 음수 -5는?", "answer": "11111011", "alts": ["1111 1011"], "explain": "비트를 모두 뒤집으면 1111 1010이고 1을 더하면 1111 1011이에요. 이번 수업 자료에는 없는 참고 문제예요.", "src": "참고"}, {"id": "1441037c", "ch": "logic", "type": "short", "q": "XOR 게이트에 A=1, B=1을 넣으면 출력 Y는?", "answer": "0", "alts": ["영"], "explain": "XOR은 두 입력이 서로 다르면 1, 같으면 0이라 1과 1이면 0이에요.", "src": "기출 Q5.4"}, {"id": "f6bd855b", "ch": "logic", "type": "mc", "q": "NAND 게이트는 어떻게 동작하나요?", "choices": ["입력이 모두 1일 때만 1", "입력이 모두 1일 때만 0이고 나머지는 1", "입력이 모두 0일 때만 1", "입력을 뒤집기만 한다"], "answer": 1, "explain": "NAND는 NOT-AND라서 AND의 반대로 동작해요.", "src": "4주차 슬라이드 16"}, {"id": "d93d4d01", "ch": "logic", "type": "ox", "q": "조합 논리 회로는 지금 들어온 입력값만으로 출력이 결정되는 회로이다.", "answer": true, "explain": "과거 기록은 기억하지 않고 현재 입력만 봐요. 반가산기·전가산기가 예예요.", "src": "4주차 슬라이드 20"}, {"id": "fe8a1b83", "ch": "logic", "type": "mc", "q": "반가산기에 A=1, B=1을 넣으면 합 S와 올림 Cout은?", "choices": ["S=1, Cout=0", "S=0, Cout=1", "S=1, Cout=1", "S=0, Cout=0"], "answer": 1, "explain": "1 + 1 = 10(이진수)이라 그 자리는 0이고 올림이 1이에요.", "src": "기출 Q5.5"}, {"id": "b99b5a7a", "ch": "logic", "type": "mc", "q": "전가산기에 A=1, B=1, Cin=1을 넣으면 S와 Cout은?", "choices": ["S=0, Cout=0", "S=1, Cout=0", "S=0, Cout=1", "S=1, Cout=1"], "answer": 3, "explain": "1이 세 개라 합은 11(이진수)이에요. 그래서 S=1, Cout=1이에요.", "src": "기출 Q5.6"}, {"id": "b9a74764", "ch": "logic", "type": "short", "q": "반가산기에서 합 S를 만드는 논리 게이트는? (올림 Cout은 AND)", "answer": "XOR", "alts": ["xor", "배타적 논리합"], "explain": "S = A XOR B, Cout = A AND B예요.", "src": "4주차 슬라이드 22"}, {"id": "b944c749", "ch": "logic", "type": "short", "q": "전가산기 8개로 만든 8비트 덧셈 계산기에서 가장 낮은 자리 전가산기의 Cin에는 무엇(숫자)을 연결하나요?", "answer": "0", "alts": ["영"], "explain": "맨 아래 자리에는 올라올 올림이 없어서 0을 넣어요. 맨 위 자리의 Cout은 연결하지 않아요.", "src": "기출 Q5.7"}, {"id": "0673d780", "ch": "logic", "type": "ox", "q": "전가산기는 반가산기 2개와 OR 게이트 1개로 만들 수 있다.", "answer": true, "explain": "첫 반가산기로 A, B를 더하고, 둘째로 그 결과와 Cin을 더한 뒤 두 올림을 OR로 합쳐요.", "src": "4주차 슬라이드 23"}, {"id": "88ac3276", "ch": "logic", "type": "short", "q": "8비트 AND 계산기에 A=10001010, B=11111011을 넣으면 출력 Y는?", "answer": "10001010", "alts": ["1000 1010"], "explain": "자리마다 AND를 해요. 1이 둘 다 있는 자리만 1이라 10001010이에요.", "src": "HW4W Q5"}, {"id": "f894428c", "ch": "logic", "type": "short", "q": "8비트 덧셈 계산기에 A=00000111(7), B=00000101(5)를 넣으면 출력 Y는?", "answer": "00001100", "alts": ["0000 1100"], "explain": "7 + 5 = 12이고 이진수로 0000 1100이에요. 자리마다 올림이 올라가요.", "src": "기출 Q5.7"}, {"id": "4d198f1b", "ch": "logic", "type": "mc", "q": "계산기(ALU)를 만드는 순서(아래부터 쌓는 차례)로 옳은 것은?", "choices": ["논리게이트 → 반도체 → 논리회로 → ALU", "반도체 → 논리게이트 → 논리회로 → ALU", "ALU → 논리회로 → 논리게이트 → 반도체", "논리회로 → 반도체 → ALU → 논리게이트"], "answer": 1, "explain": "레고처럼 작은 블록부터 쌓아요. 반도체 조합 → 게이트, 게이트 조합 → 논리회로, 회로 조합 → ALU예요.", "src": "4주차 슬라이드 9"}, {"id": "6cbf8bad", "ch": "logic", "type": "mc", "q": "트랜지스터의 두 가지 기능은 무엇인가요?", "choices": ["스위치와 증폭", "저장과 삭제", "압축과 해제", "인코드와 디코드"], "answer": 0, "explain": "트랜지스터는 전기로 전기를 켜고 끄는 스위치이고, 작은 신호를 키우는 증폭기예요.", "src": "4주차 슬라이드 11"}, {"id": "36f70aef", "ch": "cpu", "type": "short", "q": "CPU의 필수 구성요소 중 산술·논리 연산을 실제로 수행하는 장치는? (영문 약자)", "answer": "ALU", "alts": ["산술논리연산장치", "산술 논리 연산 장치"], "explain": "ALU는 산술논리연산장치예요. 덧셈, 곱셈, AND, OR 같은 계산을 해요.", "src": "5주차 슬라이드 7"}, {"id": "f5f3644e", "ch": "cpu", "type": "short", "q": "메모리에서 명령어를 가져와 해독하고 필요한 장치에 제어 신호를 보내는 CPU 구성요소는?", "answer": "제어장치", "alts": ["CU", "control unit"], "explain": "제어장치(CU)는 지휘자처럼 명령을 풀어 읽고 각 장치에 신호를 줘요.", "src": "5주차 슬라이드 7"}, {"id": "14d3d3be", "ch": "cpu", "type": "mc", "q": "프로그램 카운터(PC)에는 무엇이 들어 있나요?", "choices": ["현재 계산 결과", "다음에 읽어 올 명령어의 주소", "메모리에서 읽은 데이터", "ALU 제어신호"], "answer": 1, "explain": "PC는 책갈피처럼 다음에 읽을 명령의 주소를 가리켜요.", "src": "5주차 슬라이드 25, 기출 Q7"}, {"id": "b5710e7b", "ch": "cpu", "type": "mc", "q": "MAR와 MBR의 역할로 옳은 것은?", "choices": ["MAR는 메모리 주소, MBR는 메모리와 주고받는 값", "MAR는 계산 결과, MBR는 명령 주소", "MAR는 제어신호, MBR는 반도체", "둘은 같은 역할"], "answer": 0, "explain": "MAR에는 읽거나 쓸 번지가, MBR에는 읽어 온 값이나 쓸 값이 잠깐 들어가요.", "src": "5주차 슬라이드 25"}, {"id": "6803fce4", "ch": "cpu", "type": "short", "q": "명령 실행 5단계 중 첫 단계(PC가 가리키는 명령을 메모리에서 IR로 가져오는 단계)는?", "answer": "인출", "alts": ["fetch", "인출(fetch)"], "explain": "인출 → 해독 → 실행 → 데이터 → 기록 순서예요. 첫 단계는 인출(fetch)이에요.", "src": "5주차 슬라이드 25, 기출 Q7"}, {"id": "5ec2de23", "ch": "cpu", "type": "short", "q": "명령 실행 5단계 중 ALU가 X, Y 값으로 실제 계산을 하는 단계는?", "answer": "실행", "alts": ["execute", "실행(execute)"], "explain": "ALU가 제어신호(+ 등)대로 계산해 결과를 AC에 놓는 단계가 실행(execute)이에요.", "src": "5주차 슬라이드 25, 기출 Q7"}, {"id": "447c0f69", "ch": "cpu", "type": "ox", "q": "ADD R3 R1 R2 같은 레지스터 계산 명령은 데이터(data) 단계에서 메모리를 읽거나 쓴다.", "answer": false, "explain": "메모리를 읽고 쓰는 명령(LOAD, STORE)만 데이터 단계에서 일해요. ADD는 이 단계가 No action이에요.", "src": "5주차 슬라이드 29, 34"}, {"id": "368aaebf", "ch": "cpu", "type": "short", "q": "명령어 하나가 메모리 2칸을 차지할 때, PC가 4인 명령을 인출한 뒤 PC의 값은?", "answer": "6", "alts": ["6번지", "06"], "explain": "04, 05번지를 읽었으니 다음 명령은 06번지예요. 그래서 PC는 6이 돼요.", "src": "기출 Q7 ③"}, {"id": "3721b7d2", "ch": "cpu", "type": "mc", "q": "ADD R3 R1 R2에서 R1=5, R2=7일 때 실행 단계 뒤 AC에 들어가는 값은?", "choices": ["2", "12", "35", "57"], "answer": 1, "explain": "ADD이므로 5 + 7 = 12가 AC에 들어가고, 기록 단계에서 R3에 써요.", "src": "기출 Q7 ⑩"}, {"id": "1b8d550c", "ch": "cpu", "type": "short", "q": "ALU의 제어신호 C가 C7부터 +, -, x, /, &, |, >>, << 순서일 때, 덧셈의 C 값을 8비트로 쓰면?", "answer": "10000000", "alts": ["1000 0000"], "explain": "덧셈은 맨 앞(C7)이라 1000 0000이에요. 곱셈이면 세 번째라 0010 0000이에요.", "src": "기출 Q6.2"}, {"id": "5e8f8898", "ch": "cpu", "type": "mc", "q": "RISC와 CISC에 대한 설명으로 옳은 것은?", "choices": ["RISC는 복잡한 명령 한 줄로 처리하고 대표는 x86이다", "RISC는 단순한 명령을 빠르게 처리하고 대표는 ARM이다", "CISC는 고정 길이 명령만 쓴다", "둘은 완전히 같다"], "answer": 1, "explain": "RISC는 단순 명령을 여러 줄 써도 빨리 처리(ARM), CISC는 복잡해도 한 줄로 처리(x86)해요.", "src": "5주차 슬라이드 43, 6주차 녹취"}, {"id": "2c984d1b", "ch": "cpu", "type": "short", "q": "여러 명령어를 단계별로 한 칸씩 밀어 동시에 진행해서 CPU를 더 빠르게 하는 기법은?", "answer": "파이프라이닝", "alts": ["파이프라인", "pipelining", "pipeline"], "explain": "5단계가 서로 신호가 안 겹치므로 앞 명령이 해독할 때 뒤 명령이 인출해요.", "src": "5주차 슬라이드 44"}, {"id": "ca5a2484", "ch": "cpu", "type": "mc", "q": "'4코어 8스레드' CPU에 대한 설명으로 옳은 것은?", "choices": ["코어가 8개이다", "물리 코어는 4개이고, 하이퍼스레딩으로 8개처럼 동작한다", "코어 4개가 각각 8GHz이다", "스레드가 코어보다 적다"], "answer": 1, "explain": "하이퍼스레딩은 코어 하나가 일을 2배로 하는 것처럼 보이게 해요.", "src": "5주차 슬라이드 48"}, {"id": "7ad3c5c4", "ch": "cpu", "type": "ox", "q": "CPU 클럭은 발열과 상관없이 얼마든지 높일 수 있다.", "answer": false, "explain": "클럭이 높아지면 전력과 발열이 늘어 온도가 올라가서 한계가 있어요. 그래서 멀티코어로 갔어요.", "src": "기출 Q1.5, 5주차 슬라이드 49"}, {"id": "bccc5c3a", "ch": "cpu", "type": "short", "q": "반도체 집적도가 약 2년(24개월)마다 2배가 된다는 법칙의 이름은?", "answer": "무어의 법칙", "alts": ["무어", "Moore's law", "무어의법칙"], "explain": "인텔 공동창업자 고든 무어가 말한 법칙이에요. 메모리판은 황의 법칙이라 함정이에요.", "src": "5주차 슬라이드 49, 기출 Q1.2"}, {"id": "4686b920", "ch": "memory", "type": "mc", "q": "접근 속도가 빠른 순서로 옳은 것은?", "choices": ["RAM > 레지스터 > 캐시 > SSD", "레지스터 > 캐시 > RAM > SSD", "캐시 > 레지스터 > SSD > RAM", "SSD > RAM > 캐시 > 레지스터"], "answer": 1, "explain": "레지스터 < 1ns, 캐시 0.5~2.5ns, RAM 50~70ns, SSD 20~200µs 순으로 느려져요.", "src": "6주차 슬라이드 9"}, {"id": "1564969a", "ch": "memory", "type": "short", "q": "CPU 안에 들어 있는 메모리 두 가지는 레지스터와 무엇인가요?", "answer": "캐시", "alts": ["캐쉬", "cache"], "explain": "레지스터와 캐시는 CPU 칩 안에 있고, RAM은 CPU 밖 별도 부품이에요.", "src": "기출 Q8.1"}, {"id": "52480d48", "ch": "memory", "type": "ox", "q": "SSD는 CPU가 직접 접근해 데이터를 읽고 쓸 수 있다.", "answer": false, "explain": "SSD는 CPU 직접 접근 불가예요. RAM에 올린 뒤 CPU가 써요.", "src": "6주차 슬라이드 9"}, {"id": "d2e66d9e", "ch": "memory", "type": "short", "q": "(기출 Q8.4) 엑셀로 계산할 때, CPU(ALU)가 지금 합 계산을 하고 있는 값 170만과 220만은 어디에 적재되나요?", "answer": "레지스터", "alts": ["register", "3"], "explain": "ALU가 바로 쓰는 값은 CPU 안 가장 빠른 레지스터에 있어요.", "src": "기출 Q8.4 5)"}, {"id": "18ce4a44", "ch": "memory", "type": "mc", "q": "접근 속도 표에서 RAM(DRAM)의 접근 속도는?", "choices": ["1ns 미만", "0.5~2.5ns", "50~70ns", "5~20ms"], "answer": 2, "explain": "RAM은 50~70ns예요. 캐시는 0.5~2.5ns, HDD는 5~20ms예요.", "src": "6주차 슬라이드 9"}, {"id": "41958e4f", "ch": "memory", "type": "short", "q": "캐시를 만드는 데 쓰는, 빠르지만 비싸서 작은 용량에 쓰는 메모리 소자(정적 RAM)는?", "answer": "SRAM", "alts": ["정적 RAM", "에스램", "sram"], "explain": "SRAM은 트랜지스터 6개로 만들고 전원이 있는 한 값이 유지돼요. DRAM은 리프레시가 필요하고 싸서 RAM에 써요.", "src": "6주차 슬라이드 18"}, {"id": "3c44dd16", "ch": "memory", "type": "short", "q": "주기억장치(RAM)에 가장 많이 쓰이며 값을 유지하려면 리프레시가 필요한 메모리 종류는?", "answer": "DRAM", "alts": ["동적 RAM", "디램", "dram"], "explain": "DRAM은 트랜지스터 1개와 커패시터 1개로 만들어 싸고 대용량에 알맞아요.", "src": "6주차 슬라이드 18"}, {"id": "88f9cdd1", "ch": "memory", "type": "mc", "q": "메모리 용어 중 '요청한 뒤 처음 응답이 오기까지 걸리는 시간'을 뜻하는 것은?", "choices": ["대역폭", "레이턴시", "용량", "지역성"], "answer": 1, "explain": "레이턴시는 낮을수록 빨라요. 대역폭은 단위 시간당 전송량이라 다른 개념이에요.", "src": "6주차 슬라이드 4"}, {"id": "7924b028", "ch": "memory", "type": "short", "q": "단위 시간당 전송되는 데이터 양을 뜻하는 메모리 성능 용어는? (스루풋과 같은 말)", "answer": "대역폭", "alts": ["bandwidth", "스루풋", "throughput"], "explain": "대역폭이 클수록 같은 시간에 더 많이 옮겨요. 물탱크 크기에 비유해요.", "src": "6주차 슬라이드 4"}, {"id": "be4cb7f0", "ch": "memory", "type": "short", "q": "데이터를 읽을 때 특정 영역과 그 주변을 몰아서 자주 접근하는 경향을 뭐라고 하나요?", "answer": "지역성", "alts": ["locality", "국소성"], "explain": "시험공부를 1장, 2장, 3장 순서로 하는 것처럼 가까운 데이터를 몰아서 써요. 캐시 효율에 영향을 줘요.", "src": "6주차 슬라이드 4"}, {"id": "ad4631f5", "ch": "memory", "type": "short", "q": "RAM이 모자라 쫓겨난 프로세스를 저장장치의 특별한 공간에 모아 두는 영역은?", "answer": "스왑 영역", "alts": ["스왑영역", "스왑메모리", "스왑 메모리", "스왑", "swap area"], "explain": "가상메모리가 RAM보다 큰 일을 할 수 있게 저장장치 일부를 빌려 쓰는 공간이에요.", "src": "7주차 PDF(06 메모리와 운영체제2) 7쪽"}, {"id": "327c7baf", "ch": "memory", "type": "short", "q": "가상메모리에서 페이지 크기가 4KB(4,096바이트)일 때, 가상주소 10,000의 페이지 번호는? (10,000 = 페이지번호 × 4096 + 오프셋)", "answer": "2", "alts": ["2번", "2페이지"], "explain": "10,000을 4096으로 나누면 몫이 2, 나머지가 1808이에요. 몫이 페이지 번호예요.", "src": "7주차 PDF 13쪽"}, {"id": "beba588c", "ch": "memory", "type": "short", "q": "위 문제(가상주소 10,000, 페이지 4096바이트)에서 오프셋은?", "answer": "1808", "alts": ["1,808"], "explain": "10,000 − 2 × 4096 = 1808이에요. 오프셋은 주소 변환 뒤에도 그대로예요.", "src": "7주차 PDF 13쪽"}, {"id": "4dbaa48e", "ch": "memory", "type": "ox", "q": "TLB 미스가 발생하면 반드시 페이지 폴트가 발생한다.", "answer": false, "explain": "TLB 미스는 주소 변환 정보가 TLB에 없다는 뜻일 뿐이에요. 페이지가 RAM에 있으면 페이지 테이블을 보고 정상 변환해요.", "src": "7주차 PDF 15쪽, HW7W Q3"}, {"id": "f35aa44a", "ch": "memory", "type": "mc", "q": "TLB는 무엇을 저장하나요?", "choices": ["실제 데이터", "페이지 → 프레임 주소 변환 정보", "운영체제 코드", "명령어 집합"], "answer": 1, "explain": "TLB는 주소 변환 정보의 캐시예요. 실제 데이터는 CPU 캐시와 RAM에 있어요.", "src": "7주차 PDF 15, 18쪽"}, {"id": "f3913882", "ch": "memory", "type": "ox", "q": "가상 페이지의 크기와 물리 프레임의 크기는 같다.", "answer": true, "explain": "가상메모리는 페이지로, RAM은 같은 크기의 프레임으로 나눠야 1대1로 대응돼요.", "src": "7주차 PDF 11쪽, HW7W Q3"}, {"id": "bc0b628e", "ch": "memory", "type": "mc", "q": "하나의 프로세스는 두고 그 안에서 여러 흐름을 병렬로 실행하는 것은?", "choices": ["멀티 프로세싱", "멀티 쓰레딩", "싱글코어", "오버클럭"], "answer": 1, "explain": "크롬 창 하나에 탭을 여러 개 띄우는 것이 멀티 쓰레딩이고, 창을 여러 개 띄우는 것이 멀티 프로세싱이에요.", "src": "7주차 녹취, 기출 Q1.9"}, {"id": "25e3934a", "ch": "storage", "type": "mc", "q": "자기적 성질을 이용해 데이터를 저장하는 보조기억장치는?", "choices": ["SSD", "HDD", "CD-ROM", "RAM"], "answer": 1, "explain": "HDD는 자석 원판의 N극·S극으로 0과 1을 기록해요. CD-ROM은 광학, SSD는 전자 방식이에요.", "src": "기출 Q10.1"}, {"id": "808e9ff1", "ch": "storage", "type": "mc", "q": "레이저 빛의 반사로 정보를 읽는 광학 저장장치는?", "choices": ["HDD", "SSD", "CD-ROM", "레지스터"], "answer": 2, "explain": "CD-ROM은 홈(피트)과 평평한 곳(랜드)에서 반사되는 빛의 차이로 0과 1을 읽어요.", "src": "기출 Q10.2, 7주차 PDF 39쪽"}, {"id": "a2092e7d", "ch": "storage", "type": "short", "q": "여러 개의 보조기억장치를 연결해 하나의 큰 논리적 저장장치처럼 쓰는 기술은? (영문 약자)", "answer": "RAID", "alts": ["레이드", "raid"], "explain": "RAID는 작은 디스크 여러 개를 묶어 용량·속도·안전성을 높여요.", "src": "기출 Q10.4"}, {"id": "3a0620c0", "ch": "storage", "type": "short", "q": "보조기억장치 하나를 작은 용량의 여러 공간으로 나누어 쓰는 것은?", "answer": "파티션", "alts": ["partition", "파티셔닝"], "explain": "큰 집을 방으로 나누는 것과 같아요. RAID와 반대 방향이에요.", "src": "기출 Q10.5"}, {"id": "ee451b5d", "ch": "storage", "type": "mc", "q": "RAID 1의 방식으로 옳은 것은?", "choices": ["데이터를 여러 디스크에 나눠 쓴다(스트라이핑)", "같은 데이터를 두 디스크에 복제한다(미러링)", "패리티를 여러 디스크에 분산한다", "디스크 하나를 나눈다"], "answer": 1, "explain": "RAID 1은 미러링이에요. 용량은 늘지 않지만 한 디스크가 고장 나도 복구할 수 있어요.", "src": "7주차 PDF 49쪽"}, {"id": "2b62c7a5", "ch": "storage", "type": "short", "q": "4TB 디스크 4개를 RAID 0으로 묶으면 쓸 수 있는 전체 용량은 몇 TB인가요?", "answer": "16", "alts": ["16TB", "16테라바이트", "16 TB"], "explain": "RAID 0은 나눠 써서 용량을 그대로 합쳐요. 4 × 4 = 16TB예요. (RAID 1이면 용량 이득이 없어요.)", "src": "7주차 녹취"}, {"id": "2d83c2f2", "ch": "storage", "type": "mc", "q": "디스크 액세스 시간을 구하는 식으로 옳은 것은?", "choices": ["탐색시간 + 회전지연시간 + 데이터 전송시간", "탐색시간 × 회전지연시간", "회전지연시간 − 전송시간", "전송시간만"], "answer": 0, "explain": "헤드가 트랙으로 가고(탐색), 원판이 돌아 섹터가 오고(회전지연), 데이터를 옮기는(전송) 시간을 더해요.", "src": "7주차 PDF 36쪽"}, {"id": "677b539f", "ch": "storage", "type": "short", "q": "7200rpm 디스크는 1회전에 약 8.33ms가 걸린다. 평균 회전지연시간(반 바퀴)은 약 몇 ms인가요?", "answer": "4.17", "alts": ["4.17ms", "약 4.17", "4.2"], "explain": "평균은 반 바퀴라 8.33 ÷ 2 = 약 4.17ms예요. (계산값 4.17ms)", "src": "7주차 PDF 37쪽"}, {"id": "1fc32a93", "ch": "storage", "type": "short", "q": "평균 탐색시간 6ms, 평균 회전지연 3ms, 데이터 전송 0.01ms, 제어기 오버헤드 0.2ms인 디스크의 액세스 시간은 몇 ms인가요?", "answer": "9.21", "alts": ["9.21ms"], "explain": "6 + 3 + 0.01 + 0.2 = 9.21ms예요. 더하기만 하면 돼요.", "src": "7주차 PDF 38쪽"}, {"id": "794d0d14", "ch": "storage", "type": "short", "q": "RAID에서 b0=1, b1=1, b3=1이고 패리티 p=1일 때(p = b0⊕b1⊕b2⊕b3), 고장 난 디스크 b2의 값은?", "answer": "0", "alts": ["영"], "explain": "p = 1⊕1⊕b2⊕1에서 b2 = p⊕b0⊕b1⊕b3 = 1⊕1⊕1⊕1 = 0이에요. 같은 값끼리 XOR하면 0이라는 성질을 써요.", "src": "7주차 PDF 52쪽"}, {"id": "895f3492", "ch": "storage", "type": "mc", "q": "SSD와 HDD 중 자주 쓰는 운영체제 같은 프로그램을 보관하는 데 효율적인 것과 그 이유는?", "choices": ["SSD, 빠르지만 같은 용량에 가격이 비싸서 자주 쓰는 것만 보관", "HDD, 빠르고 싸서", "RAM, 전원이 꺼져도 남아서", "CD-ROM, 가장 빨라서"], "answer": 0, "explain": "SSD는 빠르지만 비싸고 HDD는 느리지만 싸요. 그래서 OS는 SSD, 동영상·사진은 HDD에 둬요.", "src": "기출 Q10.6~10.9"}, {"id": "a075b1f1", "ch": "hw", "type": "short", "q": "HW3W: 정(正) 한 글자는 5를 뜻한다. 正正正正正正正(7글자)는 십진수로 얼마인가요?", "answer": "35", "alts": ["35개"], "explain": "5씩 7번이라 7 × 5 = 35예요.", "src": "HW3W Q1"}, {"id": "83bf1cb4", "ch": "hw", "type": "short", "q": "HW3W: 십진수 35를 1바이트(8비트) 이진수로 나타내면?", "answer": "00100011", "alts": ["0010 0011"], "explain": "35 = 32 + 2 + 1이라 0010 0011이에요.", "src": "HW3W Q1.2"}, {"id": "f5bea911", "ch": "hw", "type": "short", "q": "HW3W: 십진수 35를 16진수로 나타내면?", "answer": "23", "alts": ["0x23", "(23)16"], "explain": "35 = 2 × 16 + 3이라 16진수로 23이에요. (8진수는 43이에요.)", "src": "HW3W Q1.3"}, {"id": "d4617b0d", "ch": "hw", "type": "short", "q": "HW3W: 십진수 35를 5진수로 나타내면?", "answer": "120", "alts": ["(120)5"], "explain": "35 = 1 × 25 + 2 × 5 + 0이라 5진수로 120이에요. 5로 계속 나눠 나머지를 거꾸로 읽어도 돼요.", "src": "HW3W Q1.3"}, {"id": "7b407294", "ch": "hw", "type": "short", "q": "HW3W: 이름 John의 첫 글자 J의 ASCII 코드는 74이다. 이를 1바이트 이진수로 나타내면?", "answer": "01001010", "alts": ["0100 1010"], "explain": "74 = 64 + 8 + 2라 0100 1010이에요.", "src": "HW3W Q2.2"}, {"id": "4d834e7c", "ch": "hw", "type": "short", "q": "HW3W: MUL R2, 5, 5를 ALU에서 계산할 때 출력 Y(8비트)는?", "answer": "00011001", "alts": ["0001 1001"], "explain": "5 × 5 = 25이고 이진수로 0001 1001이에요. 이때 제어신호 C는 곱셈이라 0010 0000이에요.", "src": "HW3W Q3.2, 3주차 슬라이드 4"}, {"id": "96e89a26", "ch": "hw", "type": "mc", "q": "HW4W: 회로가 X = A XOR B, Y = X AND (NOT B), Z = Y OR B일 때, A=1, B=1이면 X, Y, Z는?", "choices": ["X=1, Y=1, Z=1", "X=0, Y=0, Z=1", "X=0, Y=1, Z=0", "X=1, Y=0, Z=0"], "answer": 1, "explain": "X = 1 XOR 1 = 0, Y = 0 AND (NOT 1) = 0, Z = 0 OR 1 = 1이에요.", "src": "HW4W Q6, 4주차 슬라이드 21"}, {"id": "87d0e472", "ch": "hw", "type": "mc", "q": "HW6W: 메모리 계층 구조를 사용하는 이유로 가장 알맞은 것은?", "choices": ["빠르고 큰 메모리는 너무 비싸서, 가격 안에서 속도와 용량을 함께 얻으려고", "메모리를 일부러 느리게 만들려고", "전기를 아끼려고", "운영체제를 만들려고"], "answer": 0, "explain": "빠르면 작고 비싸고, 크면 느려요. 그래서 층을 나눠 배치해요.", "src": "HW6W Q5, 6주차 녹취"}, {"id": "3e29a400", "ch": "past", "type": "short", "q": "(기출 Q1.5) CPU 클럭이 높아질수록 전력 소모와 발열이 늘어 CPU의 ( )이 올라가며, 이것이 클럭을 무한정 높일 수 없게 한다. 빈칸은?", "answer": "온도", "alts": ["CPU 온도"], "explain": "클럭 상승 → 전력·발열 증가 → 온도 상승 → 회로가 탈 수 있어서 한계가 생겨요.", "src": "2023 기출 Q1.5"}, {"id": "1c2c0641", "ch": "past", "type": "short", "q": "(기출 Q1.8) 하나의 프로그램을 여러 개의 프로세스로 병렬 실행시키는 것을 ( )이라고 한다. 빈칸은?", "answer": "멀티 프로세싱", "alts": ["멀티프로세싱", "multiprocessing"], "explain": "프로세스 여러 개를 따로 띄우면 멀티 프로세싱이에요. 프로세스 하나 안의 여러 흐름은 멀티 쓰레딩이에요.", "src": "2023 기출 Q1.8"}, {"id": "68133dc9", "ch": "past", "type": "mc", "q": "(기출 Q7 ⑦) 04번지 ADD R3 R1 R2를 실행 단계에서 계산할 때 ALU의 제어신호는?", "choices": ["+", "-", "x", "&"], "answer": 0, "explain": "ADD는 덧셈이라 제어신호는 +예요. X=5, Y=7을 더해 AC=12가 돼요.", "src": "2023 기출 Q7 ⑦"}, {"id": "cca9977f", "ch": "past", "type": "mc", "q": "(기출 Q8.2) 보기 1 RAM, 2 SSD/HDD, 3 레지스터, 4 캐쉬를 접근 속도가 빠른 순서로 나열하면?", "choices": ["3, 4, 1, 2", "4, 3, 1, 2", "3, 1, 4, 2", "1, 3, 4, 2"], "answer": 0, "explain": "레지스터(3) → 캐쉬(4) → RAM(1) → SSD/HDD(2) 순이에요.", "src": "2023 기출 Q8.2"}, {"id": "414c396d", "ch": "past", "type": "short", "q": "(기출 Q8.4) 엑셀에서 2020년 4/4분기 평균을 계산할 때, 계산하려는 4분기 관련 주변부 데이터는 어디에 적재되나요? (RAM, SSD/HDD, 레지스터, 캐쉬 중)", "answer": "캐쉬", "alts": ["캐시", "cache", "4"], "explain": "지금 계산하는 부분과 그 주변은 곧 쓸 가능성이 높아 캐쉬에 올라와요. 지금 더하는 값 자체는 레지스터예요.", "src": "2023 기출 Q8.4 4)"}, {"id": "a741ce2d", "ch": "past", "type": "short", "q": "(기출 Q9.1 E) 프로그램이 물리메모리(RAM) 용량을 초과해 스왑메모리를 사용하는 과정을 ( )이라고 한다. 빈칸은?", "answer": "스와핑", "alts": ["swapping", "스왑핑"], "explain": "RAM에서 보조기억장치의 스왑 영역으로 데이터를 옮겨 쓰는 일이에요. 자주 일어나면 느려져요.", "src": "2023 기출 Q9.1 E"}, {"id": "3640cdb7", "ch": "past", "type": "short", "q": "(기출 Q9.2) 코드를 수정하지 않고 40GB 파일 때문에 생긴 렉을 해결하려면 CPU, RAM, HDD 중 무엇을 업그레이드해야 하나요?", "answer": "RAM", "alts": ["램", "ram", "RAM 용량", "메모리"], "explain": "40GB 데이터를 통째로 올릴 만큼 RAM을 늘려야 스왑이 필요 없어요. CPU는 8코어로 충분하고 HDD는 1TB라 용량이 충분해요.", "src": "2023 기출 Q9.2"}, {"id": "91bf3c81", "ch": "past", "type": "mc", "q": "(기출 Q5.6) 전가산기에 A=1, B=0, Cin=1을 넣으면 S와 Cout은?", "choices": ["S=0, Cout=1", "S=1, Cout=0", "S=1, Cout=1", "S=0, Cout=0"], "answer": 0, "explain": "1이 두 개라 합은 10(이진수)이에요. S=0, Cout=1이에요.", "src": "2023 기출 Q5.6"}, {"id": "dad3a8d7", "ch": "past", "type": "short", "q": "(기출 Q6.1 ④) 기계어 LOAD R5 CC 줄에서 메모리 주소 CC를 8비트 이진수로 쓰면?", "answer": "11001100", "alts": ["1100 1100"], "explain": "16진수 C는 십진수 12이고 이진수 1100이에요. CC는 1100 1100, 다음 번지 CD는 1100 1101이에요.", "src": "2023 기출 Q6.1 ④"}, {"id": "f23e1019", "ch": "past", "type": "mc", "q": "(기출 Q1.1~1.10) 보기 중 정답이 아니라 함정으로 나온 용어를 모두 고른 것은?", "choices": ["멀티 태스킹, 멀티 프로그래밍, 집적도, 코어, 오버클럭, 황의 법칙", "폰노이만 구조, 무어의 법칙, 싱글코어", "운영체제, 프로세스, 프로그램", "온도, 멀티코어, 멀티 쓰레딩"], "answer": 0, "explain": "보기 16개 중 정답이 아닌 6개가 함정이었어요. 교수님은 멀티 태스킹·멀티 프로그래밍은 크게 안 써도 된다고 했어요.", "src": "2023 기출 Q1, 7주차 녹취"}];window.CHS=[{"id": "c0", "title": "왕초보 컴퓨터 기초", "groups": ["basic"]}, {"id": "c1", "title": "컴퓨터 구조 소개", "groups": ["intro"]}, {"id": "c2", "title": "데이터 표현", "groups": ["data"]}, {"id": "c3", "title": "계산기 회로", "groups": ["logic"]}, {"id": "c4", "title": "중앙처리장치(CPU)", "groups": ["cpu"]}, {"id": "c5", "title": "메모리와 계층 구조", "groups": ["memory"]}, {"id": "c6", "title": "보조기억장치", "groups": ["storage"]}, {"id": "c7", "title": "과제로 복습", "groups": ["hw"]}, {"id": "c8", "title": "기출 풀이 (2023)", "groups": ["past"]}];window.CORE=["c4111ac5", "7c08c593", "a796a209", "a455fa6b", "c4802255", "e4607290", "90e0c991", "2700c085", "33a335a4", "1441037c", "fe8a1b83", "b99b5a7a", "b944c749", "36f70aef", "6803fce4", "5ec2de23", "447c0f69", "368aaebf", "3721b7d2", "1b8d550c", "bccc5c3a", "4686b920", "1564969a", "d2e66d9e", "88f9cdd1", "ad4631f5", "4dbaa48e", "bc0b628e", "25e3934a", "a2092e7d", "3a0620c0", "2d83c2f2", "895f3492", "3e29a400", "1c2c0641", "68133dc9", "cca9977f", "414c396d", "a741ce2d", "3640cdb7", "dad3a8d7"];</script>
